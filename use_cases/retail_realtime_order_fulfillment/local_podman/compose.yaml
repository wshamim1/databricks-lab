services:
  minio:
    image: minio/minio:RELEASE.2026-06-13T11-33-47Z
    container_name: retail-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2026-05-21T01-59-54Z
    container_name: retail-minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/minio-init/create_buckets_and_seed.sh"]
    volumes:
      - ./sample_data:/sample_data:ro
      - ./minio-init:/minio-init:ro

volumes:
  minio_data:
